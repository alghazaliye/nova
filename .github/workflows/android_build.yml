name: Build NOVA Messenger APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p android/NOVAMessenger/app
        echo "$GOOGLE_SERVICES_JSON" > android/NOVAMessenger/app/google-services.json

    - name: Build with Gradle
      run: |
        cd android/NOVAMessenger
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nova-messenger-debug-apk
        path: android/NOVAMessenger/app/build/outputs/apk/debug/app-debug.apk
