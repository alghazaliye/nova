name: Build NOVA Messenger APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      shell: python
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        import os
        content = os.environ.get('GOOGLE_SERVICES_JSON')
        with open('android/NOVAMessenger/app/google-services.json', 'w') as f:
            f.write(content)

    - name: Grant execute permission for gradlew
      run: chmod +x android/NOVAMessenger/gradlew

    - name: Build with Gradle
      run: cd android/NOVAMessenger && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nova-messenger-debug-apk
        path: android/NOVAMessenger/app/build/outputs/apk/debug/app-debug.apk
