<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <!--
    If you are serving the web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">
  <script>
    // Dynamic base href: works whether served from root or a sub-path (e.g. /web_app/).
    (function () {
      try {
        var p = window.location.pathname;
        var base = p.lastIndexOf('/') > 0 ? p.substring(0, p.lastIndexOf('/') + 1) : '/';
        var b = document.getElementById('dynamic-base');
        if (b && b.getAttribute('href') !== base) b.setAttribute('href', base);
      } catch (e) { /* ignore */ }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="NOVA Messenger — محادثات آمنة وسريعة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NOVA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NOVA Messenger</title>
  <link rel="manifest" href="manifest.json">

  <!-- شاشة التحميل: تُظهر حتى اكتمال تحميل Flutter -->
  <style>
    body { margin: 0; background: #f6f6fb; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    #nova-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #f6f6fb 0%, #eeecfc 100%);
      transition: opacity .45s ease;
    }
    #nova-loading.hidden { opacity: 0; pointer-events: none; }
    .nova-logo {
      width: 96px; height: 96px; border-radius: 26px;
      background: linear-gradient(135deg, #7c5cff 0%, #4d36e8 100%);
      color: #fff; font-size: 54px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 44px rgba(77,54,232,.32);
      animation: novaPulse 1.8s ease-in-out infinite;
    }
    @keyframes novaPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    #nova-loading h2 { margin: 18px 0 4px; color: #2b2850; font-size: 20px; }
    #nova-loading p { margin: 0; color: #8b87b3; font-size: 14px; }
    .nova-bar { width: 200px; height: 6px; border-radius: 3px; background: #e4e2f2; margin-top: 22px; overflow: hidden; }
    .nova-bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #7c5cff, #4d36e8);
      animation: novaSlide 1.1s ease-in-out infinite;
    }
    @keyframes novaSlide {
      0% { margin-right: 100%; }
      100% { margin-right: -100%; }
    }
    #nova-loading #nova-fallback { display: none; margin-top: 16px; font-size: 13px; color: #7c5cff; }
    #nova-loading #nova-error { display: none; margin-top: 18px; text-align: center; }
    #nova-loading #nova-error button {
      margin-top: 10px; padding: 9px 26px; border: 0; border-radius: 999px;
      background: #4d36e8; color: #fff; font-size: 14px; cursor: pointer;
      box-shadow: 0 8px 18px rgba(77,54,232,.28);
    }
    #flutter-view { min-height: 100vh; }
  </style>
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless">
</head>
<body>
  <!-- شاشة التحميل -->
  <div id="nova-loading">
    <div class="nova-logo">N</div>
    <h2>NOVA Messenger</h2>
    <p>جاري تحميل التطبيق...</p>
    <div class="nova-bar"></div>
    <p id="nova-fallback">التحميل يستغرق وقتًا أطول من المعتاد، لحظة من فضلك...</p>
    <div id="nova-error">
      <p style="color:#b3261e; margin:0;">تعذّر تحميل التطبيق. تحقق من اتصالك بالإنترنت.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </div>

  <script>
    // إخفاء شاشة التحميل عند ظهور canvas أو flutter-view
    (function () {
      var loader = document.getElementById('nova-loading');
      var fallback = document.getElementById('nova-fallback');
      var errorEl = document.getElementById('nova-error');
      var hidden = false;
      function hideLoader() {
        if (hidden) return; hidden = true;
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 500);
      }
      // fallback بعد 8 ثوانٍ + رسالة خطأ بعد 30 ثانية
      setTimeout(function () { if (!hidden) fallback.style.display = 'block'; }, 8000);
      setTimeout(function () {
        if (!hidden) { errorEl.style.display = 'block'; fallback.style.display = 'none'; }
      }, 30000);
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view') ||
            document.querySelector('flt-glass-pane') ||
            (document.body && document.body.style.opacity === '0' === false && document.querySelector('canvas'))) {
          hideLoader(); obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // احتياط: الفحص المتكرر
      var t = setInterval(function () {
        if (document.querySelector('flutter-view, flt-glass-pane, canvas.flutter-view')) { hideLoader(); clearInterval(t); obs.disconnect(); }
      }, 600);
      setTimeout(function () { clearInterval(t); }, 35000);
    })();

        // إلغاء أي خدمة ويب قديمة عند كل تحميل (تخدم index.html قديمًا = سبب 404/CORS/قطع اتصال)
    // ملاحظة: طلبات /api لا تدخل SW إطلاقًا (POST يتجاهل، وGET غير الموارد يُعاد للمتصفح)،
    // لكن حذف الكاش القديم يحسم أي بقايا index.html قديمة
    if ('serviceWorker' in navigator) {
      if (!sessionStorage.getItem('_nova_sw_cleared')) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var anyMatch = false;
          regs.forEach(function (r) {
            if (r.scope.indexOf('/web_app/') !== -1 || r.scope === location.origin + '/') {
              anyMatch = true;
              // إجبار SW الجديد على التفعيل الفوري إن وُجد
              if (r.waiting) { r.waiting.postMessage('skipWaiting'); }
              r.unregister().then(function (ok) {
                if (ok) {
                  caches.keys().then(function (keys) {
                    keys.forEach(function (k) { if (k.indexOf('flutter') !== -1) caches.delete(k); });
                  });
                  sessionStorage.setItem('_nova_sw_cleared', '1');
                  location.reload();
                }
              }).catch(function () { sessionStorage.setItem('_nova_sw_cleared', '1'); });
            }
          });
          if (!anyMatch) sessionStorage.setItem('_nova_sw_cleared', '1');
        }).catch(function () { sessionStorage.setItem('_nova_sw_cleared', '1'); });
        // حزام أمان: إن لم يحدث reload خلال 8 ثوانٍ نواصل (لا نعلق التطبيق)
        setTimeout(function () { sessionStorage.setItem('_nova_sw_cleared', '1'); }, 8000);
      }
    }
  </script>

  <script id="nova-bootstrap" src="flutter_bootstrap.js" async></script>
  <script>
    // دفاع ضد 404 للـbootstrap: إذا فشل تحميله (كاش قديم أو مسار خاطئ)،
    // نحاول تحميله من /web_app/ ثم من الجذر — ثم نعيّن المسار الصحيح ونعيد التحميل.
    (function () {
      var tries = ['flutter_bootstrap.js', '/web_app/flutter_bootstrap.js', '/flutter_bootstrap.js'];
      var el = document.getElementById('nova-bootstrap');
      el.addEventListener('error', function () {
        if (tries.length > 0) {
          var next = tries.shift();
          var s = document.createElement('script');
          s.id = 'nova-bootstrap';
          s.src = next;
          s.async = true;
          s.addEventListener('error', arguments.callee);
          el.replaceWith(s);
          // بعد نجاح التحميل من مسار مختلف: نثبّت المسار الصحيح في sessionStorage لنبهّ الكاش القديم
          var m = next.match(/^(.*)flutter_bootstrap\.js$/);
          if (m && m[1] !== '') sessionStorage.setItem('_nova_bootstrap_base', m[1]);
        }
      });
    })();
  </script>
</body>
</html>
