name: nova_flutter
description: "NOVA Messenger - تطبيق محادثات متكامل"
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.1
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  video_player: ^2.9.1
  just_audio: ^0.9.42
  record: ^5.2.1
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  intl_phone_field: ^3.2.0
  flutter_contacts: ^1.1.9+2

dependency_overrides:
  record_linux: ^2.1.1
  record_platform_interface: ^2.1.0
  record_web: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
