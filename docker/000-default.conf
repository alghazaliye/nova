<VirtualHost *:8080>
    # API + web app entry point
    DocumentRoot /var/www/html/backend/public
    <Directory /var/www/html/backend/public>
        AllowOverride All
        Require all granted
        FallbackResource /router.php
    </Directory>

    # Admin panel
    Alias /admin /var/www/html/admin
    <Directory /var/www/html/admin>
        AllowOverride All
        Require all granted
        # API routes under /admin/* must reach the PHP router via mod_rewrite.
        # Real files (login.php, *.php) are served directly.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.+)$ /var/www/html/backend/public/router.php [L]
    </Directory>

    # Flutter web app (static build)
    Alias /web_app /var/www/html/web_app
    <Directory /var/www/html/web_app>
        AllowOverride All
        Require all granted
    </Directory>

    # CORS headers for the Flutter app
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Admin-Auth, Accept"

    # Pass Authorization and X-Admin-Auth headers to PHP (CGI/FastCGI strips
    # them by default). Explicitly map X-Admin-Auth so it survives RewriteRule
    # and is readable as HTTP_X_ADMIN_AUTH in $_SERVER.
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
    SetEnvIfNoCase ^X-Admin-Auth$ "(.+)" HTTP_X_ADMIN_AUTH=$1
    CGIPassAuth On

    ErrorLog /var/www/html/backend/logs/apache_error.log
    CustomLog /var/www/html/backend/logs/apache_access.log combined
</VirtualHost>

Listen 8080
